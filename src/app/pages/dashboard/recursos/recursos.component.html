<h2>Recursos</h2>

<div *ngIf="loading">Carregando usuários...</div>
<div *ngIf="error" style="color: red">{{ error }}</div>



<!-- Campo de filtro -->
<mat-form-field appearance="outline">
  <mat-label>Filtro</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex.: João" #input>
</mat-form-field>

<!-- Tabela Angular Material -->
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let user"> {{user.id}} </td>
  </ng-container>

  <!-- Nome -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let user"> {{user.name}} </td>
  </ng-container>

  <!-- Email -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let user"> {{user.email}} </td>
  </ng-container>

  <!-- Função -->
  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef> Função </th>
    <td mat-cell *matCellDef="let user"> {{user.role}} </td>
  </ng-container>


  <!-- Ativo -->
  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef> Ativo </th>
    <td mat-cell *matCellDef="let user"> {{user.active ? 'Sim' : 'Não'}} </td>
  </ng-container>

  
  
  <!-- Ações -->
<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef> Ações </th>
  <td mat-cell *matCellDef="let user" class="actions-cell">
    <button mat-icon-button color="primary" (click)="abrirCalendario(user)">
      <mat-icon>calendar_today</mat-icon>
    </button>
    <button mat-icon-button color="accent" (click)="visualizar(user)">
      <mat-icon>search</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="excluir(user)">
      <mat-icon>delete</mat-icon>
    </button>
  </td>
</ng-container>

  <!-- Header e rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Nenhum resultado encontrado -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="9">Nenhum dado encontrado para "{{input.value}}"</td>
  </tr>
</table>
