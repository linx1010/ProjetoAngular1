<!-- Cabeçalho do calendário -->
<div class="calendar-header">
  <button (click)="prevMonth()">◀</button>
  <h2>{{ currentDate | date: 'MMMM - yyyy' }}</h2>
  <button (click)="nextMonth()">▶</button>
</div>

<!-- Grade do calendário -->
<div class="calendar-grid">
  <div class="day" *ngFor="let d of days" (click)="onDayClick(d)">
    <div *ngIf="d.day">
      <strong>{{ d.day }}</strong>
      <div class="event" *ngFor="let e of d.events">{{ e }}</div>
    </div>
  </div>
</div>

<!-- Detalhes do dia selecionado -->
<div class="day-details" *ngIf="selectedDay">
  <h3>Eventos do dia {{ selectedDay.day }}:</h3>

  <div *ngIf="selectedDay.events.length > 0; else noEvents">
    <ul>
      <li *ngFor="let e of selectedDay.events">{{ e }}</li>
    </ul>
  </div>

  <ng-template #noEvents>
    <p>Não há eventos para este dia.</p>
  </ng-template>

  <!-- Formulário para adicionar evento -->
  <div class="add-event">
    <input [(ngModel)]="newEvent" placeholder="Novo evento..." />
    <button (click)="addEvent()">Adicionar</button>
  </div>
</div>
